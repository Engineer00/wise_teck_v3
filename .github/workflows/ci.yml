# Every push and pull request: lint, formatting, migrations, Django's production checklist and the full test suite,
# on the same Python and database as the live server (Python 3.12, PostgreSQL).
name: CI

on:
  push:
    branches: [main, "fix/**", "feature/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wiseteck
          POSTGRES_USER: wiseteck
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wiseteck" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_DB: wiseteck
      POSTGRES_USER: wiseteck
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: localhost
      DJANGO_SECRET_KEY: ci-only-secret-key-that-is-long-enough-for-the-deploy-check-0123456789
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Formatting
        run: ruff format --check .
      - name: Migrations are complete
        run: python manage.py makemigrations --check --dry-run
      - name: Production checklist
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_DEBUG: "0"
          DJANGO_ALLOWED_HOSTS: wiseteck.dev
      - name: Tests
        run: python manage.py test core

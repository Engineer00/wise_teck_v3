{% extends "adminpanel/base.html" %}

{% block content %}
<section class="ap-panel ap-delete-panel">
  <h2>Confirm delete</h2>
  <p>Are you sure you want to delete this {{ meta.singular|lower }}?</p>
  <blockquote class="ap-quote">{{ object }}</blockquote>
  <p class="ap-help">This action cannot be undone.</p>

  <form method="post" class="ap-form-actions">
    {% csrf_token %}
    <button type="submit" class="ap-btn ap-btn-danger">Yes, delete</button>
    <a class="ap-btn" href="{% url 'adminpanel_change' resource object.pk %}">Cancel</a>
  </form>
</section>
{% endblock %}

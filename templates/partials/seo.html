{% load static %}<meta name="description" content="{{ seo.description }}"/>
{% if seo.canonical %}<link rel="canonical" href="{{ seo.canonical }}"/>
{% endif %}{% if seo.noindex %}<meta name="robots" content="noindex, nofollow"/>
{% else %}<meta name="robots" content="index, follow, max-image-preview:large"/>
{% endif %}<meta property="og:site_name" content="{{ seo.site_name }}"/>
<meta property="og:type" content="{{ seo.og_type }}"/>
<meta property="og:title" content="{{ seo.og_title }}"/>
<meta property="og:description" content="{{ seo.og_description }}"/>
{% if seo.canonical %}<meta property="og:url" content="{{ seo.canonical }}"/>
{% endif %}<meta property="og:image" content="{{ seo.image }}"/>
<meta property="og:locale" content="en_US"/>
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:title" content="{{ seo.og_title }}"/>
<meta name="twitter:description" content="{{ seo.og_description }}"/>
<meta name="twitter:image" content="{{ seo.image }}"/>
{% if seo.google %}<meta name="google-site-verification" content="{{ seo.google }}"/>
{% endif %}<link rel="apple-touch-icon" href="{% static 'img/wise-teck-logo-512.png' %}"/>
{% if seo.jsonld %}<script type="application/ld+json">{{ seo.jsonld }}</script>
{% endif %}

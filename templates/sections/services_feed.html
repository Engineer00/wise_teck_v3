{% load wt ap %}{% include "sections/_open.html" %}{% include "sections/_head.html" %}<div class="cards{% if s.columns == 4 %} c4{% elif s.columns == 2 %} c2{% endif %}">{% for x in s.feed %}<article class="card reveal d{{ forloop.counter0|mod:4 }}"><div class="ic">{% if x.icon_file %}<img src="{{ x.icon_file|file_url }}" alt="" width="28" height="28"/>{% else %}<i class="fa-solid {{ x.icon|default:'fa-laptop-code' }}"></i>{% endif %}</div><h3>{{ x.name }}</h3><p>{{ x.short_description }}</p>{% if x.link_url %}<a class="more" href="{{ x.link_url }}">{{ s.item_label|default:"Read More" }} <i class="fa-solid fa-arrow-right"></i></a>{% endif %}</article>{% endfor %}</div></div></section>

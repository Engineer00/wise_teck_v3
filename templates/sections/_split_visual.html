{% load wt %}{% if s.visual == "quote" %}<div class="glass quote-card rhythm reveal"><div class="q">&ldquo;</div><blockquote>{{ s.quote_text|hl:s.quote_highlight }}</blockquote><div class="sig"><span><i class="fa-solid {{ s.quote_icon|default:'fa-quote-left' }}"></i></span><div><b>{{ s.quote_author }}</b><small>{{ s.quote_role }}</small></div></div></div>{% elif s.visual == "photo" and s.img %}<div class="media reveal"><img src="{{ s.img }}"{% srcset s.img "split" %} alt="{{ s.image_alt }}" loading="lazy"/></div>{% elif s.visual == "checklist" %}<div class="glass panel rhythm reveal"><h3>{{ s.list_title }}</h3><ul class="checks">{% for t in s.list_lines %}<li><i class="fa-solid fa-check"></i>{{ t }}</li>{% endfor %}</ul></div>{% endif %}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>Something went wrong | Wise-Teck</title>
<style>
  /* Self-contained on purpose: shown when something failed, so it needs no database, template tags or files. */
  :root{--ink:#10123f;--muted:#4b4f73;--violet:#6d28d9;--canvas:#f7f8fe;--white:#fff}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--canvas);color:var(--ink);
       font:16px/1.7 Inter,system-ui,sans-serif;text-align:center}
  main{max-width:34em}
  h1{margin:0 0 12px;font-size:clamp(30px,5vw,48px);line-height:1.1;letter-spacing:-.02em}
  p{margin:0 0 24px;color:var(--muted)}
  a{display:inline-block;padding:12px 24px;border-radius:999px;background:var(--violet);color:var(--white);
    font-weight:600;text-decoration:none}
</style>
</head>
<body>
<main>
  <h1>Something went wrong</h1>
  <p>Sorry, this page could not be shown just now. Please try again in a minute.</p>
  <a href="/">Back to Home</a>
</main>
</body>
</html>
